name: Release Bootstrapper Infrastructure - prod
on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "infra/bootstrapper/prod/**"

permissions:
  contents: read
  id-token: write

jobs:
  release:
    uses: pagopa/dx/.github/workflows/release-terraform-bootstrapper-v1.yaml@5dd06bf87a5b37b0c1515b8c4891b53445f723c7 # main
    name: Release Bootstrapper (prod)
    secrets: inherit
    with:
      environment: "prod"
