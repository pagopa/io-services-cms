name: Infra Drift Detection

on:
  workflow_dispatch:
  schedule:
    - cron: '00 06 * * *' # Run at 06:00 every day

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  drift_detection_itn:
    uses: pagopa/dx/.github/workflows/infra_drift_detection.yml@5dd06bf87a5b37b0c1515b8c4891b53445f723c7 # main
    name: Drift Detection Italy North
    secrets: inherit
    with:
      environment: prod
      base_path: 'infra/resources/'
      override_github_environment: 'infra-prod'
      use_private_agent: true

  drift_detection_weu:
    name: Drift Detection West Europe
    runs-on: [self-hosted]
    environment: infra-prod-ci
    steps:
      - name: Checkout
        id: checkout
        # from https://github.com/actions/checkout/commits/main
        uses: actions/checkout@1f9a0c22da41e6ebfa534300ef656657ea2c6707
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup terraform
        id: setup-version
        # from https://github.com/pagopa/eng-github-actions-iac-template/tree/main/terraform/terraform-install-action
        uses: pagopa/eng-github-actions-iac-template/terraform/terraform-install-action@fa09a2b6def96e72c1b529ade6bd031c18562978 # main

      - name: Terraform drift detection
        # from https://github.com/pagopa/eng-github-actions-iac-template/tree/main/azure/terraform-driftdetection-azure-action
        uses: pagopa/eng-github-actions-iac-template/azure/terraform-driftdetection-azure-action@fa09a2b6def96e72c1b529ade6bd031c18562978 # main
        with:
          client_id: ${{ secrets.ARM_CLIENT_ID }}
          tenant_id: ${{ secrets.ARM_TENANT_ID }}
          subscription_id: ${{ secrets.ARM_SUBSCRIPTION_ID }}
          dir: 'infra/src'
          azure_environment: prod
