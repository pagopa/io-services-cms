name: Terraform apply multiregion

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "infra/resources/prod/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/infra-release-p.yml"

jobs:
  infra_release_prod_itn:
    uses: pagopa/dx/.github/workflows/infra_apply.yaml@bb7abcc5354751fc2e23608fd406effda931b1b9 # main
    name: Terraform apply
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources
      use_private_agent: true
      override_github_environment: infra-prod
