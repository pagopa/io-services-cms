name: Terraform plan multiregion

on:
  workflow_dispatch:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
    paths:
      - "infra/resources/prod/**"
      - "infra/resources/_modules/**"
      - ".github/workflows/infra-review-p.yml"

jobs:
  infra_review:
    uses: pagopa/dx/.github/workflows/infra_plan.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    name: Terraform plan
    secrets: inherit
    with:
      environment: prod
      base_path: infra/resources
      use_private_agent: true
      override_github_environment: infra-prod
