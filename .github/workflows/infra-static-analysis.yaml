name: Static Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - infra/**
      - .terraform-version
      - .pre-commit-config.yaml
      - .trivyignore

jobs:
  tf_analysis:
    uses: pagopa/dx/.github/workflows/static_analysis.yaml@6abcf9bc0956833202dae18c8218b4a4bc85a7f5 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
