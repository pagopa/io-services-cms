name: Static Analysis

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
    paths:
      - infra/**
      - .terraform-version
      - .pre-commit-config.yaml
      - .trivyignore

jobs:
  tf_analysis:
    uses: pagopa/dx/.github/workflows/static_analysis.yaml@5dd06bf87a5b37b0c1515b8c4891b53445f723c7 # main
    name: Terraform Validation
    secrets: inherit
    with:
      enable_modified_files_detection: true
