name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@723b8233cd9c48bac7cc9e796471d4e12d4f8e5c # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
