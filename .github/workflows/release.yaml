name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@1677605cbcd6fca87fba88b2ed5224b6b0ebede8 # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
