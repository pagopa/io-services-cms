name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@d025f45d6725b88af4a7b6e391f4ae13d58af13c # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
