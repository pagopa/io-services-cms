name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@a48a894c64c3f04404ebe274ce9a750c903c7d70 # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
