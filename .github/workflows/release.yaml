name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@abb37e552370c4b3e2e5b2601c76a307f421c074 # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
