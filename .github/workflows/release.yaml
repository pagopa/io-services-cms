name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@36ff122137235d814f3dbd20068acfb521d3fd74 # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
