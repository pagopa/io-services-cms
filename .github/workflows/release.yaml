name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@d137c49e2c0a935a544a3b87dae98472e5e5c4fd # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
