name: Release

on:
  push:
    branches:
      - master
    paths:
      - .changeset/**

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    uses: pagopa/dx/.github/workflows/release-v1.yaml@4096ba9f421ebb4a452ccec6953e67bc2872657f # main
    with:
      environment: release
    secrets:
      github-token: ${{ secrets.BOT_TOKEN }}
