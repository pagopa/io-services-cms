name: io-services-cms

networks:
  local:

volumes:
  cosmos-data:
  postgres-data:

services:
  cosmosdb:
    image: mcr.microsoft.com/cosmosdb/linux/azure-cosmos-emulator:vnext-latest
    environment:
      ENABLE_INIT_DATA: 'true'
      PROTOCOL: http
    healthcheck:
      test: ['CMD', 'curl', '--fail', 'http://localhost:8080/ready']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    ports:
      - '8081:8081'
      - '1234:1234'
    volumes:
      - cosmos-data:/data
      - ./docker/cosmos-init:/init:ro
    networks:
      - local

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: reviewer
      POSTGRES_PASSWORD: postgres-local
      POSTGRES_USER: postgres
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d reviewer']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - local

  postgres-migrations:
    image: flyway/flyway:11-alpine
    command:
      - -url=jdbc:postgresql://postgres:5432/reviewer
      - -user=postgres
      - -password=postgres-local
      - -placeholders.appUser=reviewerusr
      - -placeholders.appUserPassword=services-app-local
      - -placeholders.readonlyUser=local_readonly
      - -placeholders.readonlyUserPassword=readonly-local
      - -connectRetries=10
      - migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./apps/io-services-cms-webapp/db/schema/migrations/reviewer:/flyway/sql:ro
    networks:
      - local

  services-app:
    profiles: ['app']
    build:
      context: .
      dockerfile: apps/services-app/Dockerfile
    environment:
      CMS_COSMOSDB_CONNECTION_STRING: AccountEndpoint=http://cosmosdb:8081/;AccountKey=C2y6yDjf5/R+ob0N8A7Cgv30VRDJIWEHLM+4QDU5DE2nQ9nDuVTqobD4b8mGGyPMbIZnqyMsEcaGQy67XIw/Jw==;
      CMS_COSMOSDB_CONTAINER_SERVICES_LIFECYCLE: services-lifecycle
      CMS_COSMOSDB_CONTAINER_SERVICES_PUBLICATION: services-publication
      CMS_COSMOSDB_NAME: db-services-cms
      HOST: 0.0.0.0
      NODE_ENV: development
      PORT: 3000
      POSTGRES_DATABASE: reviewer
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: services-app-local
      POSTGRES_PORT: 5432
      POSTGRES_SSL_ENABLED: 'false'
      POSTGRES_USER: reviewerusr
      TOPIC_SCHEMA: taxonomy
      TOPIC_TABLE: topic
    depends_on:
      cosmosdb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      postgres-migrations:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'wget',
          '--spider',
          '--quiet',
          'http://localhost:3000/api/health',
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - '3000:3000'
    networks:
      - local

  azurite:
    profiles: ['cms']
    image: mcr.microsoft.com/azure-storage/azurite:latest
    command: azurite --blobHost 0.0.0.0 --tableHost 0.0.0.0 --queueHost 0.0.0.0 --skipApiVersionCheck
    ports:
      - '10000:10000'
      - '10001:10001'
      - '10002:10002'
    networks:
      - local

  azurite-setup:
    profiles: ['cms']
    image: node:24-alpine@sha256:2bdb65ed1dab192432bc31c95f94155ca5ad7fc1392fb7eb7526ab682fa5bf14
    depends_on:
      - azurite
    working_dir: /app
    volumes:
      - ./docker/cms/setup-azurite-containers.js:/app/setup-azurite-containers.js:ro
    command: sh -c "npm install @azure/storage-blob@^12.28.0 @azure/storage-queue@^12.28.1 @azure/data-tables@^13.3.2 && node setup-azurite-containers.js"
    networks:
      - local

  eventhubs:
    profiles: ['cms']
    image: mcr.microsoft.com/azure-messaging/eventhubs-emulator:latest@sha256:25ec4141efb69933a0c82e6a787fa147a3895519e7d236d4c41ba568e03100eb
    depends_on:
      - azurite
    environment:
      ACCEPT_EULA: Y
      BLOB_SERVER: azurite
      METADATA_SERVER: azurite
    ports:
      - '5672:5672'
      - '9092:9092'
      - '9093:9093'
    volumes:
      - ./docker/cms/eventhubs-emulator.json:/Eventhubs_Emulator/ConfigFiles/Config.json:ro
    networks:
      - local

  kafka-ui:
    profiles: ['cms']
    image: provectuslabs/kafka-ui:latest@sha256:8f2ff02d64b0a7a2b71b6b3b3148b85f66d00ec20ad40c30bdcd415d46d31818
    depends_on:
      - eventhubs
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: eventhubs:9092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: SASL_PLAINTEXT
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_MECHANISM: PLAIN
      KAFKA_CLUSTERS_0_PROPERTIES_SASL_JAAS_CONFIG: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="$$ConnectionString" password="Endpoint=sb://eventhubs;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;";'
    ports:
      - '8002:8080'
    networks:
      - local
